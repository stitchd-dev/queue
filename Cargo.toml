[package]
name = "event_queue"
version = "0.1.0"
edition = "2024"

[lib]
name = "queue_consumer"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
serde_json = "1.0.145"
deadpool = "0.12.3"
deadpool-postgres = "0.14.1"
tokio-postgres = {version = "0.7.15", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"]}
uuid = {version = "1.18.1", features = ["serde", "v4"]}
futures = "0.3.31"
derive_more = {version = "2.0.1", features = ["from", "display", "error"]}
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
async-trait = "0.1"
chrono = "0.4"
bytes = "1.10.1"
crossbeam = "0.8"
arc-swap = "1.8"